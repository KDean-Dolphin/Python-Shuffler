[tool.poetry]
name = "lazy-fisher-yates-shuffler"
version = "1.0.5"
description = "Lazy Fisher-Yates shuffler"
license = "Apache-2.0"
authors = [
    "Kevin Dean <Kevin.Dean@datadevelopment.com>"
]
readme = "README.md"
repository = "https://github.com/KDean-Dolphin/Python-Shuffler"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
poetry-core = "^2.5.0"

[[tool.poetry.source]]
name = "test-pypi"
url = "https://test.pypi.org/legacy/"
priority = "supplemental"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
